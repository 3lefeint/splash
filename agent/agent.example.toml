[server]
url = "ws://splash.example:8080/v1/agent/ws"
token = ""
# Optional: Cloudflare Access service token of this agent, sent as CF-Access-Client-Id / CF-Access-Client-Secret in the
# handshake. Set both or neither; keep the secret out of version control.
cf_client_id = ""
cf_client_secret = ""

[agent]
# Stable id of this installation, for example "driver-pc". Leave it empty to use the name of this PC.
id = ""
# Durable messages (laps, events) are kept here until the backend acknowledged them. Relative names count from the
# folder of this file.
spool_dir = "spool"
# Optional: write every message to this NDJSON file (about 2-3 GB per 24 hours); usable with splash-replay.
record_file = ""
# Optional: write the raw plugin buffers (gzip if the name ends in .gz) so a session can be replayed offline with
# "splash-agent replay-raw". Use it for short test sessions.
raw_file = ""

[poll]
telemetry_hz = 5
scoring_hz = 2

[log]
# DEBUG, INFO, WARNING or ERROR; the command line option --log-level overrides it. Lines go to the console.
level = "INFO"

[update]
# The single-file Windows build looks for a newer release of the agent and installs it when the game is idle.
enabled = true
# GitHub repository with the releases (tags agent-vX.Y.Z).
repo = "3lefeint/splash"
check_hours = 6
