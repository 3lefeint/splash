apiVersion: apps/v1
kind: Deployment
metadata:
  name: splash
spec:
  # The live state is kept in memory, so there is exactly one instance.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: splash
  template:
    metadata:
      labels:
        app: splash
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Applies the database migrations as the owner role; the app itself only gets the restricted role.
        - name: migrate
          image: ghcr.io/3lefeint/splash
          args: [migrate]
          env:
            - name: SPLASH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: splash-migrate
                  key: url
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: splash
          image: ghcr.io/3lefeint/splash
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPLASH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: splash-database
                  key: url
            - name: SPLASH_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: splash-agent
                  key: token
            # Browser authentication and the first administrators. Optional here so staging and dev start without the secret;
            # the prod overlay makes the team domain and the audience required. See deploy/README.md.
            - name: SPLASH_ACCESS_TEAM_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: splash-access
                  key: team-domain
                  optional: true
            - name: SPLASH_ACCESS_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: splash-access
                  key: audience
                  optional: true
            - name: SPLASH_ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: splash-access
                  key: admin-emails
                  optional: true
            # Key that seals the Cloudflare secrets of the members in the database, and the address members reach the
            # backend at (for the configuration of an agent). Optional: without the key no secret is stored.
            - name: SPLASH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: splash-access
                  key: secret-key
                  optional: true
            - name: SPLASH_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: splash-access
                  key: public-url
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
