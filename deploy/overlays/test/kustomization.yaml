apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: splash
nameSuffix: -test
resources:
  - ../../base
labels:
  - pairs:
      env: test
    includeSelectors: true
images:
  - name: ghcr.io/3lefeint/splash
    newTag: master
patches:
  - target:
      kind: Ingress
      name: splash
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: splash-test.example.com
  - target:
      kind: Deployment
      name: splash
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/valueFrom/secretKeyRef/name
        value: splash-test-database
      - op: replace
        path: /spec/template/spec/containers/0/env/1/valueFrom/secretKeyRef/name
        value: splash-test-agent
