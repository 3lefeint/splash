apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: splash
resources:
  - ../../base
# Separates the selectors from the test overlay, which runs in the same namespace.
labels:
  - pairs:
      env: prod
    includeSelectors: true
images:
  - name: ghcr.io/3lefeint/splash
    newTag: latest
patches:
  - target:
      kind: Ingress
      name: splash
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: splash.example.com
