apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: splash
resources:
  - ../../base
# Separates the selectors from the staging overlay, which runs in the same namespace.
labels:
  - pairs:
      env: prod
    includeSelectors: true
images:
  - name: ghcr.io/3lefeint/splash
    newTag: latest
patches:
  - target:
      kind: Ingress
      name: splash
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: splash.example.com
      - op: replace
        path: /spec/ingressClassName
        value: public
  # Prod must not start without browser authentication: these two references are required, not optional.
  - target:
      kind: Deployment
      name: splash
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/env/2/valueFrom/secretKeyRef/optional
      - op: remove
        path: /spec/template/spec/containers/0/env/3/valueFrom/secretKeyRef/optional
